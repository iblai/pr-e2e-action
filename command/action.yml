# PR e2e slash commands — /retest, /status, /report, /cancel.
#
# WHY THIS IS AN ACTION
# Same reason as the root action: one copy, versioned, fixable without touching three repos.
# NOTE the different threat model though: an `issue_comment` workflow always runs from the DEFAULT
# branch, never from the PR, so this one is NOT subject to merge-ref staleness. A fork PR cannot
# edit the handler to weaken its own checks — that property is what the security model rests on,
# and it is why authorization can live here safely.
#
# WHAT THIS DELIBERATELY DOES NOT DO
# It never dispatches the central pipeline itself. /retest recycles the `run-tests` label and lets
# the existing `pull_request` path run exactly as it always has. Two reasons: there is no second
# dispatch path to secure, and — the one that bit us — a PR's REQUIRED CHECK only updates when the
# caller workflow runs. A command that produced a report without refreshing the check would look
# like it worked while leaving the PR unmergeable.

name: 'IBL PR e2e — slash commands'
description: 'Handle /retest, /status, /report and /cancel comments on a PR'

inputs:
  source_repo:
    description: 'os | lms | web-frontend'
    required: true
  pr_number:
    description: 'PR number (github.event.issue.number)'
    required: true
  comment_body:
    description: 'The comment text (github.event.comment.body)'
    required: true
  comment_author:
    description: 'Login of the commenter (github.event.comment.user.login)'
    required: true
  comment_id:
    description: 'Comment id — used to add a reaction as an ack'
    required: false
    default: ''
  label:
    description: 'The label whose recycle triggers the e2e workflow'
    required: false
    default: 'run-tests'
  repo_token:
    description: "Calling repo's GITHUB_TOKEN — labels, comments, reactions, cancelling caller runs"
    required: true
  dispatch_token:
    description: 'PAT with Actions read/write on iblai/iblai-deploy-ops — /status and /cancel'
    required: true
  label_token:
    description: >
      PAT with issues:write on THIS repo, used only to recycle the trigger label for /retest.
      REQUIRED for /retest. It cannot be GITHUB_TOKEN: a label set with GITHUB_TOKEN raises no
      events, so the recycle succeeds and no run ever starts. Falls back to dispatch_token, which
      works only if that PAT also has write access here.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Parse the command
      id: parse
      env:
        BODY: ${{ inputs.comment_body }}
      shell: bash
      run: |
        set -euo pipefail
        # Only the FIRST line is considered, so quoting someone else's comment cannot trigger anything.
        FIRST=$(printf '%s' "$BODY" | head -1 | tr -d '\r' | sed 's/[[:space:]]*$//')
        case "$FIRST" in
          /retest|/retest\ *|/status|/report|/cancel|/help|/e2e-help)
            echo "cmd=$(printf '%s' "$FIRST" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
            echo "args=$(printf '%s' "$FIRST" | cut -s -d' ' -f2-)" >> "$GITHUB_OUTPUT"
            echo "match=yes" >> "$GITHUB_OUTPUT"
            echo "command recognised: $FIRST"
            ;;
          *)
            echo "match=no" >> "$GITHUB_OUTPUT"
            echo "not a pr-e2e command — ignoring"
            ;;
        esac
    - name: Authorize
      id: auth
      if: steps.parse.outputs.match == 'yes'
      env:
        GH_TOKEN: ${{ inputs.repo_token }}
        WHO: ${{ inputs.comment_author }}
        PR: ${{ inputs.pr_number }}
      shell: bash
      run: |
        set -uo pipefail
        # Repo COLLABORATOR PERMISSION, not author_association. author_association reports MEMBER for any
        # org member — including people with no write access here — so gating on it would let a much wider
        # set of accounts occupy a shared test environment.
        PERM=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${WHO}/permission" --jq '.permission' 2>/dev/null || echo none)
        FORK=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.head.repo.full_name' 2>/dev/null || echo unknown)
        echo "commenter=$WHO permission=$PERM head_repo=$FORK"

        OK=no; WHY=""
        case "$PERM" in admin|write|maintain) OK=yes ;; esac
        # Mirrors the `gate` job: a fork PR never reaches the shared environments.
        if [ "$FORK" != "$GITHUB_REPOSITORY" ]; then
          OK=no; WHY="this is a fork PR — e2e does not run on forks (same rule as the \`gate\` job)"
        elif [ "$OK" != "yes" ]; then
          WHY="\`$WHO\` needs **write** access to \`$GITHUB_REPOSITORY\` (has: \`$PERM\`)"
        fi

        echo "ok=$OK" >> "$GITHUB_OUTPUT"
        if [ "$OK" != "yes" ]; then
          echo "authorized=no — $WHY"
          B=$(printf '%s\n' "🚫 **Not authorized.** ${WHY}" "" "_No test run was started and no environment was touched._")
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$B" >/dev/null \
            || echo "::error::could not post the not-authorized notice"
          exit 0
        fi
        echo "authorized=yes"
    - name: Acknowledge
      if: steps.parse.outputs.match == 'yes' && steps.auth.outputs.ok == 'yes' && inputs.comment_id != ''
      env:
        GH_TOKEN: ${{ inputs.repo_token }}
        CID: ${{ inputs.comment_id }}
      shell: bash
      run: |
        set -uo pipefail
        # A 👀 within seconds tells the author the command was seen. Without it, the gap between commenting
        # and a run appearing reads as "nothing happened" — which is what sends people to ask a maintainer,
        # the exact interruption these commands exist to remove.
        gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/comments/${CID}/reactions" -f content='eyes' >/dev/null 2>&1 \
          || echo "::warning::could not add the 👀 acknowledgement reaction"
    - name: Run the command
      if: steps.parse.outputs.match == 'yes' && steps.auth.outputs.ok == 'yes'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.repo_token }}
        OPS_TOKEN: ${{ inputs.dispatch_token }}
        LABEL_TOKEN: ${{ inputs.label_token }}
        CMD: ${{ steps.parse.outputs.cmd }}
        ARGS: ${{ steps.parse.outputs.args }}
        PR: ${{ inputs.pr_number }}
        WHO: ${{ inputs.comment_author }}
        SOURCE_REPO: ${{ inputs.source_repo }}
        LABEL: ${{ inputs.label }}
      run: |
        # `shell: bash` runs this with `-e -o pipefail`. Under -e, `C=$(f)` where f exits non-zero
        # kills the shell INSTANTLY and SILENTLY — no error, no line number. That is exactly what
        # happened to /status: it printed "executing" and vanished, with a GREEN workflow the first
        # time. `set -uo pipefail` does NOT disable -e; only `set +e` does.
        #
        # This handler is mostly best-effort API calls where one failure should be REPORTED, not
        # abort everything. So errexit is off and what matters is checked explicitly: say() and
        # recycle_label() set RC, and the step exits on RC at the end.
        # (Same class as the bash -e bug that made the eviction-retry branch dead code in os#367.)
        set +e
        set -uo pipefail
        RC=0
        OPS=iblai/iblai-deploy-ops
        # Report failures instead of swallowing them. `>/dev/null 2>&1 || true` meant a failed POST
        # looked identical to a successful one: workflow green, log empty, user sees nothing happen
        # and has no way to find out why. If the reply cannot be posted, that IS the failure.
        say() {
          local out rc
          out=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$1" 2>&1); rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::could not post the reply comment (exit $rc): ${out}"
            RC=1
            return 1
          fi
          echo "posted reply comment"
        }

        # Newest central run for this PR, whatever env it landed on. Prefix match that STOPS BEFORE the
        # env — naming an env in a title match is exactly what caused the 2026-08-04 live-lock.
        central_run() {
          GH_TOKEN="$OPS_TOKEN" gh run list -R "$OPS" --workflow=pr-e2e.yml --limit 30 \
            --json databaseId,status,conclusion,displayTitle,createdAt \
            --jq "[.[] | select(.displayTitle | startswith(\"PR e2e — ${SOURCE_REPO}#${PR} →\"))] | sort_by(.createdAt) | .[-1] // empty" 2>/dev/null || true
        }
        caller_run() {
          gh run list -R "$GITHUB_REPOSITORY" --workflow=pr-e2e-tests.yml --limit 30 \
            --json databaseId,status,conclusion,displayTitle,createdAt \
            --jq "[.[] | select(.displayTitle | test(\"#${PR} \"))] | sort_by(.createdAt) | .[-1] // empty" 2>/dev/null || true
        }
        # jq rather than an embedded python heredoc: single-line, so it survives editing and
        # re-indentation without care. (An indented heredoc would also work — YAML strips the block
        # indentation — but one-liners are harder to break.)
        jfield() { printf '%s' "$1" | jq -r --arg k "$2" '.[$k] // ""' 2>/dev/null || true; }
        # Pipeline text quoted in a reply must not mention anyone or link an issue on a public PR.
        NEUTRAL='gsub("@"; "@\u200b") | gsub("#(?<d>[0-9])"; "#\u200b\(.d)")'

        # The ONLY trigger path. Remove-then-add fires `labeled`, which pr-e2e-tests.yml listens for.
        # GitHub's "Re-run jobs" is NOT equivalent — it replays the old merge ref.
        #
        # MUST use a PAT, NOT GITHUB_TOKEN. Anything done with GITHUB_TOKEN raises NO events —
        # GitHub's loop prevention. The label really is removed and re-added, the API returns 200,
        # the timeline shows both events, and NO workflow starts. This has now bitten in three
        # forms: releases (on: release), tags (on: push: tags), and now labels. Verified on os#381:
        # a recycle by github-actions[bot] triggered nothing; the same recycle by a human did.
        recycle_label() {
          local t="${LABEL_TOKEN:-}"
          [ -z "$t" ] && t="${OPS_TOKEN:-}"
          if [ -z "$t" ]; then
            echo "::error::no PAT available to recycle the label — GITHUB_TOKEN cannot trigger a run"
            RC=1; return 1
          fi
          GH_TOKEN="$t" gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels/${LABEL}" >/dev/null 2>&1 || true
          sleep 2
          GH_TOKEN="$t" gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels" -f "labels[]=${LABEL}" >/dev/null \
            || { echo "::error::the PAT cannot write labels on ${GITHUB_REPOSITORY} — set the label_token input to a PAT with issues:write here. GITHUB_TOKEN cannot be used: labels it sets raise no events."; RC=1; return 1; }
          echo "recycled the ${LABEL} label using the PAT"
        }

        # Do not claim a run started without looking. A silently-dead trigger is exactly the failure
        # this command exists to remove, so if nothing appears, say so instead of reporting success.
        confirm_triggered() {
          local before="$1" after i
          for i in 1 2 3 4 5 6; do
            sleep 5
            after=$(gh run list -R "$GITHUB_REPOSITORY" --workflow=pr-e2e-tests.yml --limit 5 \
                      --json databaseId --jq '[.[].databaseId] | max' 2>/dev/null || echo 0)
            [ -n "$after" ] && [ "$after" != "$before" ] && { echo "new caller run: $after"; return 0; }
          done
          echo "::error::the ${LABEL} label was recycled but no caller run appeared within 30s"
          RC=1
          return 1
        }

        # Each repo drives a different suite. Hardcoding "mentor" told lms and web-frontend users
        # the wrong thing about their own runs.
        case "$SOURCE_REPO" in
          os)           SUITE=mentor ;;
          lms)          SUITE=skills ;;
          web-frontend) SUITE=auth   ;;
          *)            SUITE="$SOURCE_REPO" ;;
        esac
        echo "executing $CMD for #${PR} (source_repo=$SOURCE_REPO, suite=$SUITE, requested by $WHO)"
        case "$CMD" in
          /help|/e2e-help)
            say "$(printf '%s\n' \
              "### PR e2e commands" "" \
              "| command | what it does |" \
              "|---|---|" \
              "| \`/retest\` | re-run the **full** suite |" \
              "| \`/retest <spec>\` | re-run **only** matching spec files — minutes instead of ~45 |" \
              "| \`/status\` | where this PR is in the queue, and what is running |" \
              "| \`/report\` | link to the latest report for this PR |" \
              "| \`/cancel\` | stop this PR's run and free the environment |" "" \
              "\`<spec>\` matches as a substring, so \`/retest 34\` and \`/retest 34-workflows\` both work." \
              "Several are allowed: \`/retest 34-workflows 50-chat\`." "" \
              "Requires **write** access to this repo; fork PRs are not eligible.")"
            ;;

          /status)
            C=$(central_run); L=$(caller_run)
            PEND=$(GH_TOKEN="$OPS_TOKEN" gh run list -R "$OPS" --workflow=pr-e2e.yml --limit 30 \
                    --json status --jq '[.[] | select(.status=="queued" or .status=="pending")] | length' 2>/dev/null || echo '?')
            RUN=$(GH_TOKEN="$OPS_TOKEN" gh run list -R "$OPS" --workflow=pr-e2e.yml --limit 30 \
                    --json status,displayTitle --jq '[.[] | select(.status=="in_progress") | .displayTitle] | join(", ")' 2>/dev/null || echo '?')
            CID=$(jfield "$C" databaseId); CST=$(jfield "$C" status); CCO=$(jfield "$C" conclusion)
            LST=$(jfield "$L" status);     LCO=$(jfield "$L" conclusion)
            # In words, before any run ids: what this PR's run is doing now, or how it ended.
            NOW=""
            if [ -n "$CID" ] && [ "$CST" = "completed" ]; then
              if GH_TOKEN="$OPS_TOKEN" gh run download "$CID" -R "$OPS" -n pr-e2e-result -D "$RUNNER_TEMP/st" >/dev/null 2>&1; then
                NOW=$(jq -r "(.headline // empty) | ${NEUTRAL}" "$RUNNER_TEMP/st/pr-e2e-result.json" 2>/dev/null || true)
              fi
              NOW="**Finished:** ${NOW:-${CCO}}"
            elif [ -n "$CID" ]; then
              STAGE=$(GH_TOKEN="$OPS_TOKEN" gh api "repos/$OPS/actions/runs/$CID/jobs" \
                        --jq '[.jobs[] | select(.status=="in_progress") | .name] | join(", ")' 2>/dev/null || true)
              NOW="**Running now:** ${STAGE:-waiting for the test environment}"
              # The suite's live counts and most common cause so far, published by the central run.
              if curl -fsS --max-time 10 -o "$RUNNER_TEMP/live.json" \
                   "https://tests.iblai.app/runs/pr-${SOURCE_REPO}-${PR}-${CID}/${SUITE}/live.json" 2>/dev/null; then
                LIVE=$(python3 "$GITHUB_ACTION_PATH/../render.py" --live "$RUNNER_TEMP/live.json" 2>/dev/null \
                         | sed 's/^e2e progress: //' || true)
                [ -n "$LIVE" ] && NOW="${NOW} — ${LIVE}"
              fi
            else
              NOW="**No run yet.** Add the \`${LABEL}\` label or comment \`/retest\` to start one."
            fi
            if [ -n "$CID" ]; then
              MINE="\`${CST}/${CCO:--}\` — [central run ${CID}](https://github.com/iblai/iblai-deploy-ops/actions/runs/${CID}) (maintainers)"
            else
              MINE="no central run yet"
            fi
            say "$(printf '%s\n' \
              "### Status — #${PR}" "" \
              "${NOW}" "" \
              "- **this PR's central run:** ${MINE}" \
              "- **this PR's caller run:** \`${LST:-none}/${LCO:--}\`" \
              "- **running now:** ${RUN:-nothing}" \
              "- **waiting in the queue:** ${PEND}" "" \
              "Runs serialize per environment, so a wait means the box is busy — not that anything is broken." \
              "A full ${SUITE} suite is ~40–50 min. \`/retest <spec>\` re-runs one file in minutes.")"
            ;;

          /report)
            RID=$(jfield "$(central_run)" databaseId)
            if [ -z "$RID" ]; then
              say "No central run found for this PR yet. Add the \`${LABEL}\` label or comment \`/retest\` to start one."
            else
              # AUTHORITATIVE SOURCE: the central run's own pr-e2e-result artifact carries
              # report_url. The previous version probed tests.iblai.app with curl and declared
              # "no report is published yet" when the probe failed — which told a user their report
              # did not exist while it sat there returning 200. A network probe from the runner is
              # not evidence about whether a report was produced; the run's own artifact is.
              REPORT=""; HEAD=""; HAVE=""
              if GH_TOKEN="$OPS_TOKEN" gh run download "$RID" -R "$OPS" -n pr-e2e-result -D "$RUNNER_TEMP/rep" >/dev/null 2>&1; then
                HAVE=1
                REPORT=$(jq -r '.report_url // ""' "$RUNNER_TEMP/rep/pr-e2e-result.json" 2>/dev/null || echo "")
                # Schema 2 results carry the sentence the PR comment leads with; older ones only counts.
                HEAD=$(jq -r "(.headline // \"\\(.verdict // \"?\") — \\(.failed // \"?\") failed, \\(.new_failures // \"?\") new\") | ${NEUTRAL}" \
                         "$RUNNER_TEMP/rep/pr-e2e-result.json" 2>/dev/null || echo "")
                echo "artifact report_url=${REPORT:-<none>}"
              else
                echo "no pr-e2e-result artifact on run $RID (still running, or it expired)"
              fi

              if [ -n "$REPORT" ]; then
                say "$(printf '%s\n' "### Latest report — #${PR}" "" \
                  "**${HEAD}**" "" \
                  "**[Full report, traces and screenshots](${REPORT})**")"
              elif [ -n "$HAVE" ]; then
                # The run finished without a report: say why rather than pointing at a URL that 404s.
                say "$(printf '%s\n' "### Latest run — #${PR}" "" \
                  "**${HEAD}**" "" \
                  "It produced no test report. \`/retest\` starts a new run.")"
              else
                say "$(printf '%s\n' "### Report — #${PR}" "" \
                  "This PR's latest run hasn't finished yet. \`/status\` shows what it's doing.")"
              fi
            fi
            ;;
          /cancel)
            C=$(central_run); L=$(caller_run); DID=""
            CST=$(jfield "$C" status); LST=$(jfield "$L" status)
            case "$LST" in queued|pending|in_progress)
              LID=$(jfield "$L" databaseId)
              gh run cancel "$LID" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && DID="${DID}- caller run \`${LID}\` cancelled"$'\n' ;;
            esac
            case "$CST" in queued|pending|in_progress)
              CID=$(jfield "$C" databaseId)
              GH_TOKEN="$OPS_TOKEN" gh run cancel "$CID" -R "$OPS" >/dev/null 2>&1 && DID="${DID}- central run [\`${CID}\`](https://github.com/iblai/iblai-deploy-ops/actions/runs/${CID}) cancelled"$'\n' ;;
            esac
            if [ -n "$DID" ]; then
              say "$(printf '%s\n' "### Cancelled — requested by @${WHO}" "" "${DID}" \
                "⚠️ **A cancel does not always stop work already running on the box.** If the suite container" \
                "had started it can keep going and hold the environment lock. If the next run stays queued for" \
                "more than a few minutes, tell a maintainer — the container needs killing on the runner.")"
            else
              say "Nothing to cancel — no queued or running e2e for this PR."
            fi
            ;;

          /retest)
            # Resolve the argument to real spec paths. Substring match, because nobody remembers
            # `e2e/journeys/34-workflows.spec.ts` — they remember "34".
            MODE=full; SPECS=""
            if [ -n "${ARGS:-}" ] && [ "$ARGS" != "full" ]; then
              ALL=$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/HEAD?recursive=1" \
                     --jq '.tree[].path | select(test("^e2e/.*\\.spec\\.ts$"))' 2>/dev/null || true)
              if [ -z "$ALL" ]; then
                say "⚠️ Could not list spec files, so \`/retest ${ARGS}\` cannot be resolved. Nothing was started — use \`/retest\` for the full suite."
                exit 0
              fi
              MISS=""
              for TOK in $ARGS; do
                HIT=$(printf '%s\n' "$ALL" | grep -F -- "$TOK" || true)
                if [ -z "$HIT" ]; then MISS="$MISS $TOK"; else SPECS="$SPECS $HIT"; fi
              done
              if [ -n "$MISS" ]; then
                say "$(printf '%s\n' "❌ No spec file matches:${MISS}" "" \
                  "Nothing was started. \`/retest\` with no argument runs the full suite.")"
                exit 0
              fi
              SPECS=$(printf '%s' "$SPECS" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ' | sed 's/ *$//')
              MODE=selective
            fi

            # The marker the root action reads when it starts. Authored by github-actions[bot] and pinned
            # to the CURRENT head sha, so a new push invalidates it — a selective request can never
            # silently narrow a later commit's test run.
            HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.head.sha' 2>/dev/null || echo '')
            # `at` bounds how long this request can apply. Without it the marker lives as long as
            # the commit does, so a MANUAL label recycle hours later would silently inherit the
            # narrow scope — a green check having run 3 tests when the person expected 621.
            PAYLOAD=$(jq -nc --arg mode "$MODE" --arg specs "$SPECS" --arg head_sha "$HEAD" --arg by "$WHO" \
                    --argjson at "$(date +%s)" \
                    '{mode:$mode, specs:$specs, head_sha:$head_sha, by:$by, at:$at}')
            # ONE html comment so nothing renders. The old form put the marker on line 1 and the
            # JSON on line 2, leaving raw JSON visible in the PR conversation.
            MBODY="<!-- pr-e2e-cmd ${PAYLOAD} -->"
            EXIST=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                      --jq '[.[] | select(.body | startswith("<!-- pr-e2e-cmd"))] | .[-1].id // empty' 2>/dev/null || true)
            if [ -n "$EXIST" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXIST}" -f body="$MBODY" >/dev/null 2>&1 || true
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$MBODY" >/dev/null 2>&1 || true
            fi

            BEFORE=$(gh run list -R "$GITHUB_REPOSITORY" --workflow=pr-e2e-tests.yml --limit 5 \
                       --json databaseId --jq '[.[].databaseId] | max' 2>/dev/null || echo 0)
            recycle_label && confirm_triggered "$BEFORE" || TRIGGER_FAILED=1
            if [ "${TRIGGER_FAILED:-0}" = 1 ]; then
              say "$(printf '%s\n' "### ⚠️ Could not start the run" "" \
                "The \`${LABEL}\` label was recycled but no run appeared. Please remove the label and add it" \
                "back by hand — that always works." "" \
                "_A maintainer should check the handler's PAT: a label change made with GITHUB_TOKEN" \
                "raises no events, so the trigger silently does nothing._")"
            elif [ "$MODE" = selective ]; then
              N=$(printf '%s' "$SPECS" | wc -w | tr -d ' ')
              say "$(printf '%s\n' "### Re-running ${N} spec file(s) — requested by @${WHO}" "" \
                '```' "$(printf '%s' "$SPECS" | tr ' ' '\n')" '```' \
                "A selective run is typically **a few minutes** instead of ~45. \`/status\` for progress." "" \
                "⚠️ This proves only these files. Push a commit, or \`/retest\` with no argument, for the full suite before merging.")"
            else
              say "$(printf '%s\n' "### Re-running the full suite — requested by @${WHO}" "" \
                "Expect ~40–50 min plus any queue wait. \`/status\` for progress, \`/cancel\` to stop it." "" \
                "Next time: \`/retest <spec>\` re-runs a single file in minutes.")"
            fi
            ;;
        esac
        if [ "$RC" -ne 0 ]; then
          echo "::error::$CMD did not complete cleanly"
          exit "$RC"
        fi
        echo "$CMD complete"
