# PR e2e — dispatch the central pipeline, stream progress, publish the result.
#
# WHY THIS IS AN ACTION AND NOT A WORKFLOW IN EACH REPO
# A `pull_request` event runs workflows from the PR's MERGE REF, so a workflow copied into os/lms/
# web-frontend is frozen per-PR: a fix reaches no open PR until that PR rebases. On 2026-08-04 a
# merged fix reached none of ~27 open PRs, and every bug needed three PRs. `uses: …@v1` is resolved
# at RUN TIME from this repo, so a fix tagged v1 applies to every PR immediately, with no rebase.
#
# Versioning: v1.0.0 etc. are immutable; v1 is a moving tag. Roll back by re-pointing v1.

name: 'IBL PR e2e'
description: 'Dispatch the central e2e pipeline for a PR, stream phases, and publish the report'

inputs:
  source_repo:
    description: 'os | lms | web-frontend — selects the platform and suite in the central pipeline'
    required: true
  pr_number:
    description: 'PR number'
    required: true
  merge_sha:
    description: "The PR's MERGE commit (github.sha on a pull_request) — app image and suite both come from it"
    required: true
  head_sha:
    description: 'PR head SHA (branch tip)'
    required: true
  base_sha:
    description: 'PR base SHA — used to diff changed spec files'
    required: true
  app_image:
    description: 'The SPA image built from the merge commit'
    required: true
  mode:
    description: 'auto (detect changed specs) | full | selective'
    required: false
    default: 'auto'
  specs:
    description: 'Space-separated spec files. With mode=selective this wins over auto-detection.'
    required: false
    default: ''
  dispatch_token:
    description: 'PAT with Actions:write on iblai/iblai-deploy-ops'
    required: true
  repo_token:
    description: "GITHUB_TOKEN of the calling repo — used only to write the PR's sticky comment"
    required: true

outputs:
  conclusion:
    description: 'The central run conclusion (success | failure | cancelled | runner_unavailable | …)'
    value: ${{ steps.dispatch.outputs.conclusion }}
  run_id:
    description: 'The dispatched central run id'
    value: ${{ steps.dispatch.outputs.run_id }}

runs:
  using: composite
  steps:
    - name: Detect changed spec files
      id: specs
      env:
        BASE: ${{ inputs.base_sha }}
        MODE_IN: ${{ inputs.mode }}
        SPECS_IN: ${{ inputs.specs }}
        HEAD: ${{ inputs.head_sha }}
        PR: ${{ inputs.pr_number }}
        REPO_TOKEN: ${{ inputs.repo_token }}
      shell: bash
      run: |
        set -euo pipefail
        # A `/retest <spec>` command leaves a marker comment. Trust it only if BOTH hold:
        #   * authored by github-actions[bot] — a user cannot post as the bot, so the handler's
        #     authorization check cannot be sidestepped by hand-writing this comment; and
        #   * its head_sha matches the commit under test — otherwise a selective request made
        #     against an older commit would silently narrow a LATER push's run to a few files,
        #     leaving the rest of the suite untested while the required check went green.
        if [ -z "${MODE_IN:-}" ] || [ "$MODE_IN" = auto ]; then
          M=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                --jq '[.[] | select(.user.login=="github-actions[bot]") | select(.body | startswith("<!-- pr-e2e-cmd"))] | .[-1].body // empty' 2>/dev/null || true)
          if [ -n "$M" ]; then
            # accepts both the hidden one-line form and the older two-line one
            J=$(printf '%s' "$M" | sed -e 's/^<!-- pr-e2e-cmd //' -e 's/ *-->$//' | tail -n 1)
            C_MODE=$(printf '%s' "$J" | jq -r '.mode // ""' 2>/dev/null || echo "")
            C_SPECS=$(printf '%s' "$J" | jq -r '.specs // ""' 2>/dev/null || echo "")
            C_SHA=$(printf '%s' "$J" | jq -r '.head_sha // ""' 2>/dev/null || echo "")
            C_BY=$(printf '%s' "$J" | jq -r '.by // ""' 2>/dev/null || echo "")
            C_AT=$(printf '%s' "$J" | jq -r '.at // 0' 2>/dev/null || echo 0)
            AGE=$(( $(date +%s) - ${C_AT:-0} ))
            # 4h window. A /retest is answered within minutes even behind a full queue, so anything
            # older is a leftover rather than an intent — and a leftover that still matches the
            # commit would narrow a manual re-run nobody asked to narrow.
            if [ -n "$C_MODE" ] && [ "$C_SHA" = "$HEAD" ] && [ "${C_AT:-0}" -gt 0 ] && [ "$AGE" -lt 14400 ]; then
              MODE_IN="$C_MODE"; SPECS_IN="$C_SPECS"
              echo "::notice::/retest by ${C_BY:-?} -> mode=$MODE_IN specs=${SPECS_IN:-<all>}"
            elif [ -n "$C_SHA" ] && [ "$C_SHA" != "$HEAD" ]; then
              echo "::notice::ignoring a /retest marker from an older commit (${C_SHA:0:8} != ${HEAD:0:8}) - running normal detection"
            elif [ -n "$C_MODE" ]; then
              echo "::notice::ignoring a /retest marker ${AGE}s old (>4h) - running normal detection"
            fi
          fi
        fi
        CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- 'e2e/**/*.spec.ts' | tr '\n' ' ' | sed 's/ $//')
        OTHER=$(git diff --name-only "$BASE" "$HEAD" -- . ':(exclude)e2e/**' | head -1)
        N=$(printf '%s' "$CHANGED" | wc -w | tr -d ' ')
        # Only spec files touched (and not many) -> run just those for fast feedback.
        # Any app-source change -> full suite, since behaviour may have moved anywhere.
        if [ "$MODE_IN" = "selective" ] && [ -n "$SPECS_IN" ]; then
          MODE=selective; SPECS="$SPECS_IN"
          echo "selective (explicit override): $SPECS"
        elif [ "$MODE_IN" = "full" ]; then
          MODE=full; SPECS=""
          echo "full suite (explicit override)"
        elif [ -n "$CHANGED" ] && [ -z "$OTHER" ] && [ "$N" -le 5 ]; then
          MODE=selective; SPECS="$CHANGED"
          echo "selective: $SPECS"
        else
          MODE=full; SPECS=""
          echo "full suite (changed specs=$N, non-spec changes=${OTHER:-none})"
        fi
        # The spec list is made of file names the PR chose. No real spec needs a character
        # outside this set, so refuse anything else before the list reaches another command.
        if printf '%s' "$SPECS" | LC_ALL=C grep -q '[^A-Za-z0-9._/ -]'; then
          echo "::error::refusing to dispatch: a spec path contains unexpected characters"
          exit 1
        fi
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"; echo "specs=$SPECS" >> "$GITHUB_OUTPUT"

    - name: Dispatch e2e and wait for the result
      id: dispatch
      env:
        SOURCE_REPO: ${{ inputs.source_repo }}
        GH_TOKEN: ${{ inputs.dispatch_token }}
        PR: ${{ inputs.pr_number }}
        MERGE_SHA: ${{ inputs.merge_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
        APP_IMAGE: ${{ inputs.app_image }}
        E2E_MODE: ${{ steps.specs.outputs.mode }}
        E2E_SPECS: ${{ steps.specs.outputs.specs }}
      shell: bash
      run: |
        set -uo pipefail
        OPS=iblai/iblai-deploy-ops
        # The central run-name, reproduced exactly, so we can find OUR runs and only ours.
        # Prefix only, deliberately: the environment is chosen centrally, so this must match this
        # PR's run whichever box it lands on. Naming an env here is what broke before.
        MYTITLE="PR e2e — ${SOURCE_REPO}#${PR} →"

        # A superseded caller (label removed+re-added, or a new push) leaves the central run it
        # already dispatched ORPHANED: nothing polls it, its result is discarded, yet it holds the
        # single env runner for a full ~74-min suite and deepens the queue for everyone else.
        # Cleanup cannot live in the DYING caller — a cancelled job is the least reliable place to
        # run anything, and a caller killed before its dispatch step published outputs has no run
        # id to clean up with. So the SURVIVING caller does it: before claiming a slot, cancel any
        # still-active central run for this same PR. Only one caller per PR is ever alive
        # (concurrency: pr-e2e-<PR>, cancel-in-progress), so any other active run for this exact
        # title is by definition an orphan.
        cancel_stale_siblings() {
          local ids id
          ids=$(MYTITLE="$MYTITLE" gh run list -R "$OPS" --workflow=pr-e2e.yml --limit 40 \
                  --json databaseId,status,displayTitle \
                  --jq '[.[] | select((.status=="queued" or .status=="pending" or .status=="in_progress")
                                      and .displayTitle==env.MYTITLE) | .databaseId] | .[]' 2>/dev/null) || ids=""
          for id in $ids; do
            [ "$id" = "${RUN_ID:-}" ] && continue
            echo "::warning::cancelling orphaned central run ${id} for this PR — superseded by this caller"
            gh run cancel "$id" -R "$OPS" >/dev/null 2>&1 || true
          done
          # Never let this housekeeping abort the step: it runs unguarded under `bash -e`, and a
          # transient `gh` failure or an empty result must be a no-op, not a dead PR check.
          return 0
        }

        # GitHub keeps only ONE pending run per concurrency group. A third dispatch CANCELS the
        # previously-pending one before it starts a single job — silently, with no diagnosis on the
        # PR. Three PRs labelled close together is enough to trigger it, and pinning everything to
        # stg1 made that routine. So: never dispatch while another run is waiting.
        #
        # Counts EVERY pending pr-e2e run, deliberately — not just ones whose title mentions this
        # caller's TARGET. Filtering on the title was a correctness bug: the central `run-name`
        # renders the env the run will actually use, which an operator override
        # (`vars.PR_E2E_ENV_OVERRIDE`, added to drain a suspect box) can redirect. On 2026-08-04
        # every central title read "→ stg2" while every caller searched for "→ stg1", so the count
        # was permanently 0 — each caller believed the slot was free, all of them dispatched, and
        # they evicted one another in a live-lock: SIX dispatches for os#405, zero tests executed,
        # no report, and a red X on the PR that said nothing about the code.
        #
        # A caller cannot know the effective env, so it must never depend on inferring one. Being
        # conservative costs throughput when two envs are genuinely busy with different PRs; it
        # cannot cost correctness. That is the trade this pipeline already makes for env selection.
        wait_for_slot() {
          local i w
          for i in $(seq 1 240); do
            w=$(gh run list -R "$OPS" --workflow=pr-e2e.yml --limit 20 --json status \
                  --jq '[.[] | select(.status=="queued" or .status=="pending")] | length' 2>/dev/null || echo 0)
            [ "${w:-0}" -eq 0 ] && return 0
            [ $(( (i-1) % 10 )) -eq 0 ] && echo "[$(date -u +%H:%M:%SZ)] waiting for a free dispatch slot — ${w} pr-e2e run(s) already queued ahead"
            sleep 30
          done
          echo "::error::no free dispatch slot after 2h"; return 1
        }

        do_dispatch() {
          local before id i
          before=$(gh run list -R "$OPS" --workflow=pr-e2e.yml -L 1 --json databaseId --jq '.[0].databaseId // 0')
          # github.sha on a pull_request IS the merge commit — the same ref actions/checkout used to
          # build the app image, so the specs and the app code come from one commit.
          gh workflow run pr-e2e.yml -R "$OPS" --ref main \
            -f source_repo="$SOURCE_REPO" \
            -f pr_number="$PR" \
            -f merge_sha="$MERGE_SHA" \
            -f head_sha="$HEAD_SHA" \
            -f app_image="$APP_IMAGE" \
            -f mode="$E2E_MODE" \
            -f specs="$E2E_SPECS" || return 1
          for i in $(seq 1 30); do
            sleep 5
            id=$(gh run list -R "$OPS" --workflow=pr-e2e.yml -L 1 --json databaseId --jq '.[0].databaseId // 0')
            if [ "$id" != "$before" ] && [ "$id" != "0" ]; then RUN_ID="$id"; return 0; fi
          done
          return 1
        }

        # Returns: 0 = completed (CONCLUSION set) · 1 = timed out · 2 = EVICTED (retryable)
        poll_run() {
          local i started=0 idle_since="" any_job=0 exec_ticks=0 last="" phases active busy s now
          echo "Phases: resolve -> baseline drift check -> sync (only if drifted) -> swap SPA -> e2e -> restore"
          # Two separate budgets. Queue time must NOT count against the execution timeout: with one
          # serialized runner and ~75-min suites, a PR queued behind one other already exceeds 2h,
          # and the caller would give up on a perfectly healthy run — then download a result
          # artifact that does not exist yet and report "unknown". os#367 lost its report exactly
          # this way (dispatched 17:11, started 18:27, verdict 19:45, caller gave up 19:25).
          # While QUEUED the liveness guard below is the protection, not the clock.
          for i in $(seq 1 960); do
            phases=$(gh api "repos/$OPS/actions/runs/${RUN_ID}/jobs" \
                       --jq '[.jobs[] | "\(.name): \(.conclusion // .status)"] | join("  |  ")' 2>/dev/null || echo "")
            if [ -n "$phases" ] && [ "$phases" != "$last" ]; then
              echo "[$(date -u +%H:%M:%SZ)] $phases"; last="$phases"
            fi
            if [ "$started" = "0" ]; then
              # Count only jobs that have genuinely started executing. `!= "queued"` also
              # matched transient pre-run states (waiting/pending/requested), which could
              # latch started before the target runner ever picked up work.
              active=$(gh api "repos/$OPS/actions/runs/${RUN_ID}/jobs" \
                         --jq '[.jobs[] | select(.status == "in_progress" or .status == "completed")] | length' 2>/dev/null || echo 0)
              if [ "${active:-0}" -gt 0 ]; then
                started=1; any_job=1
                echo "[$(date -u +%H:%M:%SZ)] run started executing — 2h execution budget begins now"
              fi
            else
              exec_ticks=$((exec_ticks + 1))
              if [ "$exec_ticks" -ge 240 ]; then
                CONCLUSION=timed_out
                echo "::error::the run has been EXECUTING for 2h without finishing. https://github.com/$OPS/actions/runs/${RUN_ID}"
                return 1
              fi
            fi
            if [ "$started" = "0" ]; then
              # Which runner executes this run is NOT knowable from the env the caller REQUESTED:
              # an operator override (vars.PR_E2E_ENV_OVERRIDE) can redirect it to the other box.
              # Matching a guessed "${TARGET}-spa" made a perfectly healthy run on the OTHER runner
              # look like an offline one and killed it 62 minutes before its suite finished — the
              # report was written and the PR still said "ask a maintainer" (os#407, 2026-08-04).
              # Count activity on ANY self-hosted runner instead: if the fleet is executing anything,
              # we are QUEUED, not orphaned. Correct wherever the run lands, override or not.
              # An offline runner never appears executing ANY job anywhere; a merely BUSY one does.
              # Elapsed time cannot tell them apart when one serialized runner handles ~74-min suites.
              # Scan the 20 most recent runs (matches the env picker's window). With --limit 10,
              # a run legitimately queued behind a long (~84-min) suite whose holder has already
              # fallen out of the window reads busy=0 and gets killed with a false "offline".
              busy=$(for rid in $(gh run list -R "$OPS" --limit 20 --json databaseId --jq '.[].databaseId' 2>/dev/null); do
                       gh api "repos/$OPS/actions/runs/$rid/jobs" \
                         --jq '.jobs[] | select(.status=="in_progress") | .runner_name // empty' 2>/dev/null
                     done | grep -cvE '^(GitHub Actions|$)' || true)
              if [ "${busy:-0}" -gt 0 ]; then
                idle_since=""                   # runner is alive, we are simply queued behind work
              else
                # Gate on wall-clock, not iteration count: each poll makes ~20 extra `gh` calls
                # (the busy probe above), so a fixed strike count drifts well past its intended
                # minutes. Fire only after the runner has been continuously idle-while-queued
                # for 15 real minutes.
                now=$(date +%s)
                [ -z "$idle_since" ] && idle_since="$now"
                if [ "$((now - idle_since))" -ge 1800 ]; then
                  CONCLUSION=runner_unavailable
                  echo "::error::no self-hosted runner has executed ANY job for 30 min while this run stayed queued — the runner fleet is offline or not accepting jobs. https://github.com/$OPS/actions/runs/${RUN_ID}"
                  return 1
                fi
              fi
            fi
            s=$(gh api "repos/$OPS/actions/runs/${RUN_ID}" --jq '.status+"|"+(.conclusion//"")' 2>/dev/null)
            if [ "${s%%|*}" = "completed" ]; then
              CONCLUSION="${s##*|}"
              # Cancelled having never started a job == evicted from the pending slot, not a result.
              if [ "$CONCLUSION" = "cancelled" ] && [ "$any_job" = "0" ]; then return 2; fi
              echo "e2e finished: $CONCLUSION"
              return 0
            fi
            sleep 30
          done
          CONCLUSION=timed_out
          echo "::error::gave up after 8h — the run neither started nor finished"; return 1
        }

        # Every waiter notices the freed slot within the same poll window and would dispatch in the
        # same instant — a classic check-then-act race. A deterministic per-PR offset spreads them
        # out; the RE-CHECK after it is what actually closes the window, since the stagger alone
        # would only move the collision. PR number rather than $RANDOM: unique, stable across
        # retries, and needs no coordination between callers.
        stagger_then_claim() {
          local s
          wait_for_slot || return 1
          s=$(( (PR % 12) * 5 ))
          if [ "$s" -gt 0 ]; then
            echo "[$(date -u +%H:%M:%SZ)] stagger ${s}s (PR ${PR}) before claiming the slot"
            sleep "$s"
          fi
          wait_for_slot || return 1   # someone may have claimed it while we staggered
        }

        RUN_ID=""; CONCLUSION=""; EVICTIONS=0
        for attempt in $(seq 1 10); do
          cancel_stale_siblings
          stagger_then_claim || { echo "conclusion=no_slot" >> "$GITHUB_OUTPUT"; exit 1; }
          do_dispatch  || { echo "::error::dispatched but the run never appeared"; echo "conclusion=dispatch_failed" >> "$GITHUB_OUTPUT"; exit 1; }
          echo "dispatched run $RUN_ID (attempt $attempt)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
        # See the caller's "Cancel the dispatched central run" step: composite actions are
        # terminated on cancellation, so cleanup cannot live in here and needs this file.
        echo "$RUN_ID" > "$RUNNER_TEMP/pr-e2e-run-id"
          # `run:` steps execute under `bash -e` (see the job log's "shell: /usr/bin/bash -e {0}"),
          # and `set -uo pipefail` above does NOT clear errexit. A bare `poll_run; rc=$?` therefore
          # terminates the whole step the instant poll_run returns non-zero — so the eviction branch
          # below was unreachable dead code, and every evicted run died as a bare "exit code 2" with
          # no conclusion, no retry and no report link (os#367, 2026-07-30). Guarding the call keeps
          # errexit on for everything else while letting the return value reach $rc.
          rc=0; poll_run || rc=$?
          if [ "$rc" -eq 2 ]; then
            EVICTIONS=$((EVICTIONS + 1))
            # Greppable marker: this is the signal to watch. If evictions become routine the
            # caller-side queue is under-sized and the fix is capacity (a second env) or a real
            # external FIFO queue — not more retries. See docs/pr-e2e.md.
            echo "::warning::QUEUE_EVICTION run ${RUN_ID} was cancelled before starting any job — evicted from the concurrency queue by a newer dispatch. Re-dispatching (attempt ${attempt}/10)."
            sleep $(( (RANDOM % 20) + 5 ))   # jitter so retriers do not re-collide
            continue
          fi
          break
        done
        echo "evictions=${EVICTIONS}" >> "$GITHUB_OUTPUT"
        if [ "$EVICTIONS" -gt 0 ]; then
          echo "::notice::QUEUE_EVICTION_COUNT=${EVICTIONS} for this PR"
        fi
        echo "conclusion=${CONCLUSION:-unknown}" >> "$GITHUB_OUTPUT"
    - name: Publish the result on this PR
      if: always() && steps.dispatch.outputs.run_id != ''
      env:
        GH_TOKEN: ${{ inputs.dispatch_token }}
        REPO_TOKEN: ${{ inputs.repo_token }}
        RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        PR: ${{ inputs.pr_number }}
        DISPATCH_CONCLUSION: ${{ steps.dispatch.outputs.conclusion }}
        HEAD_SHA: ${{ inputs.head_sha }}
      shell: bash
      run: |
        set -uo pipefail
        # The Playwright report on tests.iblai.app IS public, so it is the link that actually helps
        # a developer here — unlike the private Actions run. Relay it onto the PR itself.
        # Retry briefly: the artifact is uploaded by the central run's LAST job, so a caller that
        # reaches here early (or races the upload) would otherwise silently render "unknown" and
        # throw away a perfectly good result — which is exactly how os#367 lost its report link.
        for a in 1 2 3 4 5 6; do
          gh run download "$RUN_ID" -R iblai/iblai-deploy-ops -n pr-e2e-result -D /tmp/res 2>/dev/null && break
          echo "  result artifact not available yet (attempt $a/6) — retrying in 20s"
          sleep 20
        done
        if [ ! -f /tmp/res/pr-e2e-result.json ]; then
          echo "::warning::could not download pr-e2e-result from run ${RUN_ID} — the comment will lack a report link. https://github.com/iblai/iblai-deploy-ops/actions/runs/${RUN_ID}"
        fi

        # Carry the PREVIOUS comment forward. A run that produced nothing must never erase a run
        # that produced something: an evicted dispatch used to overwrite a real verdict with
        # "unknown", losing the only PR-visible link to a perfectly good report (os#405, 2026-08-04
        # — a 452/3/6 result vanished behind an eviction that never started a test).
        GH_TOKEN="$REPO_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
          --jq '[.[] | select(.body | startswith("<!-- pr-e2e-report -->"))] | .[-1].body // empty' \
          > /tmp/prev.md 2>/dev/null || : > /tmp/prev.md

        python3 - <<'PY' > /tmp/body.md
        import json, os, pathlib, re
        p = pathlib.Path("/tmp/res/pr-e2e-result.json")
        d = json.loads(p.read_text()) if p.exists() else {}
        # The dispatch step already knows how the central run ended. Falling back to "unknown"
        # threw that away and told the developer to find a maintainer.
        v    = d.get("verdict") or os.environ.get("DISPATCH_CONCLUSION") or "unknown"
        icon = {"success": "OK", "failure": "FAILED", "cancelled": "NOT RUN"}.get(v, v)
        rep  = d.get("report_url") or ""
        rows = [("result", f"**{icon}**")]
        rid = os.environ.get("RUN_ID", "")
        if rid:
            rows.append(("central run", f"[`{rid}`](https://github.com/iblai/iblai-deploy-ops/actions/runs/{rid})"))
        hsha = os.environ.get("HEAD_SHA", "")
        if hsha:
            rows.append(("commit", f"`{hsha[:8]}`"))
        if d.get("platform"):
            rows.append(("suite", f'`{d["platform"]}` - mode `{d.get("mode","?")}` - env `{d.get("target_env","?")}`'))
        if d.get("baseline"):
            synced = " (env was synced to it first)" if d.get("drifted") == "true" else " (env already on it)"
            rows.append(("tested against", f'prod release `{d["baseline"]}`{synced}'))
        for label, key in (("failed", "failed"), ("new failures", "new_failures")):
            if d.get(key) not in (None, ""):
                rows.append((label, f'`{d[key]}`'))
        # Two comment identities, deliberately:
        #   * a run that PRODUCED a report posts its own comment and is never edited, so the PR
        #     conversation keeps a run-by-run history of what was tested and when;
        #   * a run that produced NOTHING updates one sticky notice instead — a label recycle fires
        #     two events, so cancelled dispatches would otherwise spam the thread.
        # This also kills the overwrite hazard structurally rather than by carrying text forward:
        # nothing can bury a real verdict if real verdicts are never edited.
        marker = "<!-- pr-e2e-report -->" if rep else "<!-- pr-e2e-norun -->"
        pathlib.Path("/tmp/marker").write_text(marker)
        out = [marker, f"### PR E2E - {icon}", ""]
        if rep:
            out += [f"**[Full report, traces and screenshots]({rep})**", ""]
        out += ["| | |", "|---|---|"] + [f"| {k} | {val} |" for k, val in rows]

        if not rep:
            out += ["", f"**No test report was produced** (result: `{v}`). The run did not finish a"
                        " suite — usually because another PR's run took the shared environment, a newer"
                        " commit/label superseded this one, or it was abandoned before completing."
                        " **This says nothing about your code.**", "",
                    "Re-trigger it yourself: comment **`/retest`** (or `/retest <spec>` to re-run"
                    " a single file in minutes). `/status` shows the queue."
                    " (Avoid *Re-run jobs* — that replays the old merge ref instead of"
                    " recomputing it against current `main`.)"]
            # Preserve the last known-good report so an eviction cannot bury a real result.
            prev = pathlib.Path("/tmp/prev.md").read_text() if pathlib.Path("/tmp/prev.md").exists() else ""
            m = re.search(r"\[Full report, traces and screenshots\]\((https?://[^)]+)\)", prev)
            if m:
                out += ["", f"Last completed run for this PR: **[report]({m.group(1)})** —"
                            " still valid unless this PR has changed since."]
        print("\n".join(out))
        PY
        cat /tmp/body.md >> "$GITHUB_STEP_SUMMARY"
        cat /tmp/body.md

        python3 -c "import json;print(json.dumps({'body':open('/tmp/body.md').read()}))" > /tmp/payload.json
        MARKER=$(cat /tmp/marker 2>/dev/null || echo "<!-- pr-e2e-norun -->")
        if [ "$MARKER" = "<!-- pr-e2e-report -->" ]; then
          CID=""   # a real result always gets its OWN comment — history, and nothing overwritten
        else
          # no result: reuse the single sticky notice rather than spam the thread
          CID=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                  --jq '[.[] | select(.body | startswith("<!-- pr-e2e-norun -->"))] | .[-1].id // empty' 2>/dev/null || true)
        fi
        if [ -n "$CID" ]; then
          GH_TOKEN="$REPO_TOKEN" gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${CID}" \
            --input /tmp/payload.json >/dev/null && echo "updated PR comment $CID"
        else
          GH_TOKEN="$REPO_TOKEN" gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --input /tmp/payload.json >/dev/null && echo "posted PR comment"
        fi

    - name: Gate on the e2e result
      if: always()
      env:
        CONCLUSION: ${{ steps.dispatch.outputs.conclusion }}
      shell: bash
      run: |
        echo "e2e conclusion: ${CONCLUSION:-<none>}"
        [ "$CONCLUSION" = "success" ]
